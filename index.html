<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Deployment Success</title>
    <style>
        body {
            background-color: #add8e6; /* light blue */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }
        h1 {
            color: darkgreen;
            font-weight: bold;
            text-align: center;
            margin-bottom: 40px;
        }
        .balloons, .fireworks {
            position: absolute;
            pointer-events: none;
        }
        .balloons {
            top: 0;
            animation: floatBalloons 10s linear infinite;
            z-index: 1;
        }
        .fireworks {
            bottom: 0;
            animation: popFireworks 2s ease-in-out infinite;
            z-index: 0;
        }
        @keyframes floatBalloons {
            0% { top: 100%; opacity: 1; }
            100% { top: -200px; opacity: 0; }
        }
        @keyframes popFireworks {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <h1>Wohoo! We have successfully deployed our website</h1>

    <!-- Balloons -->
    <img src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif" alt="Balloons" class="balloons" width="200">

    <!-- Firecrackers -->
    <img src="https://media.giphy.com/media/3oz8xKaR836UJOYeOc/giphy.gif" alt="Fireworks" class="fireworks" width="300">
</body>
</html>
